name: CI

on:
  push:
    branches: [ui-redesign, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ubuntu, Python 3.13, Tesseract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages (same list Streamlit Community Cloud uses)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(grep -v '^\s*#' packages.txt | xargs)
          tesseract --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Dataset is exactly reproducible from the official extraction
        run: python scripts/build_dataset.py --check
      - name: Test suite
        run: python -m pytest -q
